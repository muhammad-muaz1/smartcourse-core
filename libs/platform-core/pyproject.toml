[project]
name = "smartcourse-platform-core"
version = "0.1.0"
description = "Mechanics shared by every SmartCourse service — never a domain model or business rule"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
dependencies = [
  "fastapi>=0.141,<0.142",
  "pydantic>=2.13,<3",
  "sqlalchemy[asyncio]>=2.0,<2.1",
  "asyncpg>=0.31,<0.32",
  "redis>=8.1,<9",
  "structlog>=26.1,<27",
  "pyjwt[crypto]>=2.14,<3",
  "cryptography>=44,<51",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/platform_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=platform_core --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
source = ["platform_core"]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]
