[project]
name = "smartcourse-contracts"
version = "0.1.0"
description = "Versioned cross-service contracts — the only code two SmartCourse services share"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
dependencies = [
  "pydantic>=2.13,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/smartcourse_contracts"]
