# Prometheus inside the compose network (`make up`). Same jobs as prometheus.local.yml.
global:
  scrape_interval: 5s
  evaluation_interval: 15s

scrape_configs:
  - job_name: api
    static_configs:
      - targets: ["gateway:8000"]
        labels: { service: gateway }
      - targets: ["identity:8001"]
        labels: { service: identity }
      - targets: ["course:8002"]
        labels: { service: course }
      - targets: ["learning:8003"]
        labels: { service: learning }
      - targets: ["notification:8004"]
        labels: { service: notification }
      - targets: ["analytics:8005"]
        labels: { service: analytics }

  - job_name: worker
    static_configs:
      - targets: ["identity-worker:9101"]
        labels: { service: identity }
      - targets: ["course-worker:9102"]
        labels: { service: course }
      - targets: ["learning-worker:9103"]
        labels: { service: learning }
      - targets: ["notification-worker:9104"]
        labels: { service: notification }
      - targets: ["analytics-worker:9105"]
        labels: { service: analytics }

  - job_name: celery
    static_configs:
      - targets: ["notification-celery:9114"]
        labels: { service: notification }
