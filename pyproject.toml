# Workspace root. Holds no code — it ties the deployables and the shared library into
# one lockfile and one dev venv, and carries the lint/type config every member shares.
#
# Every service and the gateway import their own code as `src`, so none of them is
# installed as a package (tool.uv.package = false): each runs from its own directory,
# where `src` resolves to that service alone. Only libs/ are real installable packages.
[project]
name = "smartcourse"
version = "0.1.0"
description = "SmartCourse — backend for a large-scale learning platform"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
dependencies = []

[dependency-groups]
dev = [
  "ruff>=0.16,<0.17",
  "mypy>=2.3,<3",
  "pytest>=9.1,<10",
  "pytest-asyncio>=1.4,<2",
  "pytest-cov>=7.1,<8",
  "testcontainers[postgres,redis]>=4.15,<5",
  "pre-commit>=4.6,<5",
  "httpx>=0.28,<0.29",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
  "libs/platform-core",
  "libs/contracts",
  "services/identity",
  "services/course",
  "services/learning",
  "services/notification",
  "services/analytics",
  "gateway",
]

[tool.uv.sources]
smartcourse-platform-core = { workspace = true }
smartcourse-contracts = { workspace = true }

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["**/migrations/versions"]

[tool.ruff.lint]
select = [
  "E", "F", "W",   # pycodestyle / pyflakes
  "I",             # isort
  "UP",            # pyupgrade
  "B",             # bugbear
  "C4",            # comprehensions
  "SIM",           # simplify
  "ASYNC",         # async-specific lint rules
]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["src", "platform_core", "smartcourse_contracts"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's documented dependency-injection pattern is Depends(...)/Query(...) as a
# parameter default; ruff's B008 doesn't exempt these by default the way it does for a
# handful of other frameworks.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

# Run from inside each member's directory (see Makefile), with this file passed via
# --config-file, so `src` always means that member's own package.
[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "."
explicit_package_bases = true
plugins = ["pydantic.mypy"]

# asyncpg ships neither inline types nor stubs. Only the repo-root scripts/ use it
# directly; services reach it through SQLAlchemy, which is typed.
[[tool.mypy.overrides]]
module = ["asyncpg", "asyncpg.*"]
ignore_missing_imports = true

# aiokafka ships no type information (no py.typed, no stubs). Only platform_core.kafka
# imports it; everything else goes through that module's typed wrappers.
[[tool.mypy.overrides]]
module = ["aiokafka", "aiokafka.*"]
ignore_missing_imports = true

# Celery and kombu ship no type information. Only notification's Celery boundary imports
# them; that boundary is the one place untyped decorators/calls are tolerated, and the
# service code it calls stays fully typed.
[[tool.mypy.overrides]]
module = ["celery", "celery.*", "kombu", "kombu.*"]
ignore_missing_imports = true

# aioboto3 / botocore ship partial or no type information. Only the course service's
# MinioStorage imports them, lazily, behind the typed Storage protocol.
[[tool.mypy.overrides]]
module = ["aioboto3", "aioboto3.*", "botocore", "botocore.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["src.celery_app", "src.modules.notifications.tasks"]
disallow_untyped_decorators = false
disallow_untyped_calls = false
